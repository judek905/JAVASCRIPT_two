<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A small JavaScript playground: counter, greeting, themes, tools and a task list.">
  <title>JavaScript Playground</title>
  <style>
    :root {
      --accent: #2563eb;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2937;
      --border: #9ca3af;
      --muted: #6b7280;
    }
    body.dark {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --border: #4b5563;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      line-height: 1.5;
      transition: background 0.3s, color 0.3s;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { margin-top: 0; }

    section {
      background: var(--card);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      transition: background 0.3s;
    }
    h2 { margin-top: 0; font-size: 1.1rem; }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      margin: 4px 4px 4px 0;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    button:active { transform: translateY(1px); }

    input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      max-width: 100%;
    }

    /* Clear keyboard focus for everything interactive */
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    #message {
      background: var(--card);
      border-left: 5px solid var(--accent);
      padding: 12px 16px;
      border-radius: 8px;
      min-height: 1.5em;
    }
    #count { font-weight: bold; font-size: 1.4rem; }
    #secret { display: none; }

    .hint { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; }

    ul { padding-left: 20px; }
    li { margin: 6px 0; overflow-wrap: anywhere; }
    li button { background: #dc2626; padding: 2px 8px; margin-left: 8px; }

    /* Hidden visually, still read by screen readers */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      body, section { transition: none; }
    }
  </style>
  <script src="external.js" defer></script>
</head>
<body>
  <main>
    <h1>Welcome to JavaScript</h1>
    <p id="message">Click a button to see what happens.</p>
    <noscript><p>This page needs JavaScript turned on to work.</p></noscript>

    <section>
      <h2>Basics</h2>
      <button type="button" id="alertBtn">Click Me</button>
      <button type="button" id="greetBtn">External Reference</button>
      <button type="button" id="clearBtn">Clear Message</button>
    </section>

    <section>
      <h2>Counter</h2>
      <p>Count: <span id="count">0</span></p>
      <button type="button" id="decBtn">− Minus</button>
      <button type="button" id="resetBtn">Reset</button>
      <button type="button" id="incBtn">+ Plus</button>
    </section>

    <section>
      <h2>Greet Me</h2>
      <label class="sr-only" for="nameInput">Your name</label>
      <input type="text" id="nameInput" placeholder="Type your name" autocomplete="given-name">
      <button type="button" id="nameBtn">Say Hello</button>
    </section>

    <section>
      <h2>Appearance</h2>
      <button type="button" id="colorBtn">Random Accent Color</button>
      <button type="button" id="darkBtn">Toggle Dark Mode</button>
      <button type="button" id="biggerBtn">Text Bigger</button>
      <button type="button" id="smallerBtn">Text Smaller</button>
    </section>

    <section>
      <h2>Tools</h2>
      <button type="button" id="timeBtn">Show Date &amp; Time</button>
      <button type="button" id="randomBtn">Random Number (1–100)</button>
      <button type="button" id="secretBtn">Show / Hide Secret</button>
      <p id="secret">🎉 You found the secret message!</p>
    </section>

    <section>
      <h2>Task List</h2>
      <label class="sr-only" for="taskInput">New task</label>
      <input type="text" id="taskInput" placeholder="Add a task" autocomplete="off">
      <button type="button" id="addTaskBtn">Add</button>
      <p class="hint">Click a task to mark it done. Tasks are saved on this device.</p>
      <ul id="taskList"></ul>
    </section>
  </main>
</body>
</html>
