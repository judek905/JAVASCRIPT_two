<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Playground</title>
  <style>
    :root { --accent: #2563eb; --bg: #f5f7fa; --card: #ffffff; --text: #1f2937; }
    body.dark { --bg: #111827; --card: #1f2937; --text: #f3f4f6; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      transition: background 0.3s, color 0.3s;
    }
    main { max-width: 640px; margin: 0 auto; }
    section {
      background: var(--card);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }
    h2 { margin-top: 0; font-size: 1.1rem; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      margin: 4px 4px 4px 0;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #9ca3af;
      font-size: 0.95rem;
    }
    #message {
      background: var(--card);
      border-left: 5px solid var(--accent);
      padding: 12px 16px;
      border-radius: 8px;
      min-height: 1.5em;
    }
    #count { font-weight: bold; font-size: 1.4rem; }
    #secret { display: none; }
    li { margin: 6px 0; }
    li button { background: #dc2626; padding: 2px 8px; margin-left: 8px; }
  </style>
  <script src="external.js" defer></script>
</head>
<body>
  <main>
    <h1>Welcome to JavaScript</h1>
    <p id="message">Click a button to see what happens.</p>

    <section>
      <h2>Basics</h2>
      <button type="button" id="alertBtn">Click Me</button>
      <button type="button" id="greetBtn">External Reference</button>
      <button type="button" id="clearBtn">Clear Message</button>
    </section>

    <section>
      <h2>Counter</h2>
      <p>Count: <span id="count">0</span></p>
      <button type="button" id="decBtn">− Minus</button>
      <button type="button" id="resetBtn">Reset</button>
      <button type="button" id="incBtn">+ Plus</button>
    </section>

    <section>
      <h2>Greet Me</h2>
      <input type="text" id="nameInput" placeholder="Type your name">
      <button type="button" id="nameBtn">Say Hello</button>
    </section>

    <section>
      <h2>Appearance</h2>
      <button type="button" id="colorBtn">Random Accent Color</button>
      <button type="button" id="darkBtn">Toggle Dark Mode</button>
      <button type="button" id="biggerBtn">Text Bigger</button>
      <button type="button" id="smallerBtn">Text Smaller</button>
    </section>

    <section>
      <h2>Tools</h2>
      <button type="button" id="timeBtn">Show Date &amp; Time</button>
      <button type="button" id="randomBtn">Random Number (1–100)</button>
      <button type="button" id="secretBtn">Show / Hide Secret</button>
      <p id="secret">🎉 You found the secret message!</p>
    </section>

    <section>
      <h2>Task List</h2>
      <input type="text" id="taskInput" placeholder="Add a task">
      <button type="button" id="addTaskBtn">Add</button>
      <ul id="taskList"></ul>
    </section>
  </main>
</body>
</html>
